<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro | Sabores da Gê</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="cadastro.css">
</head>
<body>

  <main class="card">

    <header class="brand">
      <!-- Se o grupo tiver o logo em arquivo, troque este bloco por:
           <img src="logo.png" alt="Sabores da Gê - comida caseira" class="logo"> -->
      <h1 class="brand-title">Sabores <span>da</span> Gê</h1>
      <p class="ribbon">comida caseira</p>
    </header>

    <h2 class="page-title">Crie sua conta</h2>
    <p class="subtitle">Cadastre-se para fazer seus pedidos e receber as novidades do cardápio.</p>

    <form id="formCadastro" novalidate>

      <div class="field">
        <label for="nome">Nome completo</label>
        <input type="text" id="nome" name="nome" placeholder="Ex.: Maria da Silva" autocomplete="name">
        <small class="error" id="erro-nome"></small>
      </div>

      <div class="field">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com" autocomplete="email">
        <small class="error" id="erro-email"></small>
      </div>

      <div class="field">
        <label for="telefone">WhatsApp</label>
        <input type="tel" id="telefone" name="telefone" placeholder="(21) 99999-9999" inputmode="numeric" autocomplete="tel">
        <small class="error" id="erro-telefone"></small>
      </div>

      <div class="field">
        <label for="senha">Senha</label>
        <div class="password-wrap">
          <input type="password" id="senha" name="senha" placeholder="Mínimo de 8 caracteres" autocomplete="new-password">
          <button type="button" class="toggle-pass" data-target="senha" aria-label="Mostrar senha">Mostrar</button>
        </div>
        <div class="strength" aria-hidden="true">
          <span id="barra-forca"></span>
        </div>
        <small class="hint" id="texto-forca"></small>
        <small class="error" id="erro-senha"></small>
      </div>

      <div class="field">
        <label for="confirmaSenha">Confirmar senha</label>
        <div class="password-wrap">
          <input type="password" id="confirmaSenha" name="confirmaSenha" placeholder="Digite a senha novamente" autocomplete="new-password">
          <button type="button" class="toggle-pass" data-target="confirmaSenha" aria-label="Mostrar senha">Mostrar</button>
        </div>
        <small class="error" id="erro-confirmaSenha"></small>
      </div>

      <div class="field checkbox">
        <input type="checkbox" id="termos" name="termos">
        <label for="termos">Li e aceito os <a href="#">termos de uso</a> e a <a href="#">política de privacidade</a>.</label>
        <small class="error" id="erro-termos"></small>
      </div>

      <button type="submit" class="btn">Cadastrar</button>

      <p class="success" id="mensagem-sucesso" hidden></p>
    </form>

    <p class="login-link">Já tem conta? <a href="login.html">Entrar</a></p>

  </main>

  <script src="cadastro.js"></script>
</body>
</html>
